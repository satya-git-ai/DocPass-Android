<!-- Scripts -->
    <script>
        // --- Tip Modal & Mobile UPI Logic ---
        function toggleTipModal() {
            // Define the UPI payment link
            const upiLink = "upi://pay?pa=docpass@axl&pn=DocPass";
            
            // Check if the user is on a mobile device
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;

            if (isMobile) {
                // Trigger native payment app/scanner on mobile
                window.location.href = upiLink;
                return; // Stop execution so the modal doesn't open
            }

            // Desktop behavior: Show QR Code Modal
            const modal = document.getElementById('tipModal');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');

                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modal.querySelector('.glass-card').classList.remove('scale-95');
                    modal.querySelector('.glass-card').classList.add('scale-100');
                }, 10);
            } else {
                modal.classList.add('opacity-0');
                modal.querySelector('.glass-card').classList.remove('scale-100');
                modal.querySelector('.glass-card').classList.add('scale-95');

                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }, 300);
            }
        }

        // --- Screen Switcher Logic ---
        function switchScreen(imageName, btnElement) {
            // Update active state on buttons
            document.querySelectorAll('.screen-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            btnElement.classList.add('active');

            // Fade out, swap image, fade in
            const screenImg = document.getElementById('phone-screen');
            screenImg.style.opacity = '0';

            setTimeout(() => {
                screenImg.src = `https://raw.githubusercontent.com/satya-git-ai/DocPass-Android/main/app/${imageName}`;
                screenImg.style.opacity = '1';
            }, 200);
        }
    </script>
